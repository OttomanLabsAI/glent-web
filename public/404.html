<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Not found — Glent Group demo</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--bg:#141619;--ink:#eef0ec;--muted:#a7adaa;--accent:#f26a1b;
  --display:"Oswald",Impact,"Arial Narrow",sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);
  color:var(--ink);font:400 16px/1.6 var(--body);padding:20px}
main{max-width:560px}
.kicker{font:700 12px/1.4 var(--mono);letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);margin:0 0 14px;display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:22px;height:2px;background:var(--accent)}
h1{font-family:var(--display);font-weight:700;text-transform:uppercase;
  font-size:clamp(2.6rem,10vw,4.5rem);line-height:1.04;margin:0 0 .3em;
  max-width:none;hyphens:none;overflow-wrap:normal}
p{color:var(--muted);margin:0 0 26px}
a.btn{display:inline-block;background:var(--accent);color:#141619;font:700 15px/1 var(--body);
  text-transform:uppercase;letter-spacing:.06em;padding:15px 26px;text-decoration:none}
</style>
</head>
<body>
<main>
  <p class="kicker">SHT 404 — Not on the register</p>
  <h1 data-one-line>Not&nbsp;found</h1>
  <p>That path isn't part of this demo. The three pages are the new site, the current site, and the offer.</p>
  <a class="btn" href="/">Back to the new site</a>
</main>
</body>
</html>
