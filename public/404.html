<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Not found — Glent Group demo</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--bg:#0F3D4B;--ink:#F4F7F7;--muted:#A8BEC4;--accent:#FE5000;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);
  color:var(--ink);font:400 16px/1.6 var(--sans);padding:20px}
main{max-width:560px}
.kicker{font:700 12px/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);margin:0 0 14px;display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:22px;height:2px;background:var(--accent)}
h1{font-family:var(--sans);font-weight:700;
  font-size:clamp(2.4rem,9vw,4rem);line-height:1.06;margin:0 0 .3em;
  max-width:none;hyphens:none;overflow-wrap:normal}
p{color:var(--muted);margin:0 0 26px}
a.btn{display:inline-block;background:var(--accent);color:#0F3D4B;font:700 14px/1 var(--sans);
  text-transform:uppercase;letter-spacing:.08em;padding:15px 26px;text-decoration:none;border-radius:3px}
</style>
</head>
<body>
<main>
  <p class="kicker">SHT 404 — Not on the register</p>
  <h1 data-one-line>Not&nbsp;found</h1>
  <p>That path isn't part of this demo. The two pages are the new site and the improvements.</p>
  <a class="btn" href="/">Back to the new site</a>
</main>
</body>
</html>
